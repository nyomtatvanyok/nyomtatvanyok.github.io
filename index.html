  h1 { margin: 0; font: 800 20px/1.2 var(--cim); color: var(--barna); }
  .gyuru { position: relative; width: 108px; height: 108px; }
  .gyuru svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gyuru circle { fill: none; stroke-width: 8; }
  .gyuru .sav { stroke: #E3D9CB; }
  .gyuru .telt { stroke: var(--barna); stroke-linecap: round; }
  .szazalek { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 22px/1 var(--cim); color: var(--barna); font-variant-numeric: tabular-nums; }
  .szazalek small { font-size: 13px; margin-left: 1px; }
  .csik { position: relative; width: 100%; height: 10px; background: #E3D9CB; border-radius: 6px; overflow: hidden; }
  .csik i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--barna); border-radius: 6px; }
  #szoveg { margin: 0; font-size: 19px; font-weight: 700; }
  .hiba { color: var(--hiba); }
  button { font: 700 19px var(--szoveg); min-height: 52px; padding: 10px 24px; border-radius: 12px; cursor: pointer; background: var(--gomb); color: #fff; border: 2px solid var(--gomb); }
</style>
</head>
<body>
<main class="kartya" role="status" aria-live="polite">
  <div class="logo" role="img" aria-label="Lipóti"></div>
  <h1>Bolti nyomtatványok</h1>
  <div class="gyuru" aria-hidden="true">
    <svg viewBox="0 0 100 100"><circle class="sav" cx="50" cy="50" r="42"/><circle class="telt" id="kor" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg>
    <span class="szazalek" id="pct">0<small>%</small></span>
  </div>
  <div class="csik" aria-hidden="true"><i id="csik"></i></div>
  <p id="szoveg">Betöltés…</p>
  <button type="button" id="ujra" hidden>Újrapróbálás</button>
</main>
<script>
  // A webalkalmazás (Google Apps Script); innen jön a kész oldal, sütik nélkül, így nem számít, ki van bejelentkezve a Google-be.
  var CIM = 'https://script.google.com/macros/s/AKfycbz7ykeWRsrajcARieu2uhvIiBjD7VBsnHsQCdOwppqQ3f9Bu_HHOyZQKmgvpqdv4o_4/exec?forma=nyers';
  var KOR = 263.9, pct = 0, cel = 90, idozito = null;
  function rajzol() {
    document.getElementById('pct').innerHTML = Math.round(pct) + '<small>%</small>';
    document.getElementById('kor').setAttribute('stroke-dashoffset', (KOR * (1 - pct / 100)).toFixed(1));
    document.getElementById('csik').style.width = pct + '%';
  }
  function indit() {
    pct = 0; cel = 90; rajzol();
    document.getElementById('szoveg').textContent = 'Betöltés…';
    document.getElementById('szoveg').className = '';
    document.getElementById('ujra').hidden = true;
    clearInterval(idozito);
    idozito = setInterval(function () { if (pct < cel) { pct += Math.max(0.2, (cel - pct) * 0.04); rajzol(); } }, 60);
    fetch(CIM, { credentials: 'omit', cache: 'no-store', redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (html) {
        if (!/<html/i.test(html)) throw new Error('váratlan válasz');
        clearInterval(idozito); pct = 100; rajzol();
        document.getElementById('szoveg').textContent = 'Kész';
        setTimeout(function () { document.open(); document.write(html); document.close(); }, 120);
      })
      .catch(function (e) {
        clearInterval(idozito);
        var sz = document.getElementById('szoveg');
        sz.textContent = 'Nem sikerült betölteni. Ellenőrizd az internetkapcsolatot, és próbáld újra. (' + e.message + ')';
        sz.className = 'hiba';
        document.getElementById('ujra').hidden = false;
      });
  }
  document.getElementById('ujra').onclick = indit;
  indit();
</script>
</body>
</html>
