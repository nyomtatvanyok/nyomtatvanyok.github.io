<!DOCTYPE html>
<html lang="hu">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lipóti Pékség – Kártyaigénylés</title>
<style>
/* ===== 2. Design tokenek (a Lipóti vizuális szabálykönyvből, változtatás nélkül) ===== */
@import url('https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Montserrat:wght@800&family=Libre+Caslon+Text:wght@400;700&family=Arimo:wght@400;700&display=swap');

:root {
  --krem:   #f6ead2;
  --barna:  #7a3a0e;
  --kakao:  #4a2810;
  --morzsa: #e7d3b0;
  --liszt:  #fbf6ec;
  --gomb:   #8a4513;
  --gomb-hover: #6f370f;
  --hiba:   #a32020;
  --ok:     #2f6b2a;
  --cim:    'Montserrat', 'Arial Black', 'Segoe UI', sans-serif;
  --szoveg: 'Carlito', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--liszt); color: var(--kakao); font: 18px/1.45 var(--szoveg); }
button, input, select, textarea { font: inherit; color: inherit; }

/* ===== Oldal ===== */
.oldal { max-width: 1280px; margin: 0 auto;
  padding: 24px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
.oszlop { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
.oszlop.szeles { max-width: 1080px; }

/* 4.1 Fejléc (középen) */
.fejlec { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: center; margin-bottom: 22px; }
.fejlec img { width: 120px; height: 59px; object-fit: contain; mix-blend-mode: multiply; }
h1 { margin: 0; font: 800 clamp(24px, 4vw, 34px)/1.15 var(--cim); color: var(--barna); }

/* Profilsáv */
.profil { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid var(--morzsa); border-radius: 14px; padding: 14px 18px; }
.monogram { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--barna); color: #fff;
  display: grid; place-items: center; font: 800 17px var(--cim); }
.profil b { display: block; font-size: 20px; }
.profil .email { color: #8a6a4e; font-size: 16px; word-break: break-all; }
.jelveny { display: inline-block; background: var(--liszt); border: 1px solid var(--morzsa); border-radius: 999px;
  font: 700 13px var(--szoveg); color: var(--gomb); padding: 2px 10px; margin-top: 4px; }

/* Fülek (szerkesztő): másodlagos gombok, kiválasztott teli */
.fulek { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px 0 26px; }
.ful { background: #fff; color: var(--kakao); border: 2px solid var(--morzsa); border-radius: 12px; padding: 10px 18px;
  font-weight: 700; min-height: 52px; cursor: pointer; }
.ful:hover { border-color: var(--gomb); }
.ful[aria-pressed="true"] { background: var(--gomb); border-color: var(--gomb); color: #fff; }

/* 4.2 Számozott lépés */
.lepes { display: grid; gap: 10px; }
.lepes > label, .lepes > h2 { font-size: 22px; font-weight: 900; margin: 0; }
.szam { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-right: 10px;
  border-radius: 50%; background: var(--barna); color: #fff; font-size: 19px; vertical-align: 2px; }
.lepes.letiltva { opacity: .45; filter: grayscale(1); pointer-events: none; user-select: none; }
.tipp { font-size: 15px; color: #7a5a3e; margin: 0; }

/* 4.3 Mezők */
select, input[type=text], input[type=password], input[type=email], input[type=time], input[type=search], textarea {
  font: inherit; color: var(--kakao); background: #fff; width: 100%; max-width: 560px;
  border: 2px solid var(--morzsa); border-radius: 10px; padding: 10px 14px; min-height: 52px; }
textarea { min-height: 96px; resize: vertical; }
select:focus-visible, input:focus-visible, button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gomb); outline-offset: 2px; }
select.fo { min-height: 72px; font-size: 26px; font-weight: 700; border-color: var(--gomb); }
select.ures { color: #6b4a30; }
option { color: var(--kakao); }
option:nth-child(even) { background: #efedea; }
.hibas, .hibas .kereso-gomb { border-color: var(--hiba) !important; }
input.auto { background: #f1ece4; color: #6b5a48; border-color: #e3d8c6; cursor: not-allowed; }

/* 4.4 Keresős lenyíló */
.kereso { position: relative; width: 100%; max-width: 560px; }
.kereso-gomb { width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px 10px 18px; background: #fff; color: var(--kakao); border: 2px solid var(--morzsa); border-radius: 10px;
  font-size: 24px; font-weight: 700; text-align: left; cursor: pointer; }
.kereso-gomb.ures { color: #6b4a30; font-size: 20px; }
.kereso-gomb:hover, .kereso-gomb[aria-expanded="true"] { border-color: var(--gomb); }
.kereso-gomb svg { flex: none; width: 26px; height: 26px; color: var(--gomb); transition: transform .15s; }
.kereso-gomb[aria-expanded="true"] svg { transform: rotate(180deg); }
.kereso-panel { position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 6px); background: #fff;
  border: 2px solid var(--gomb); border-radius: 14px; padding: 10px; box-shadow: 0 14px 40px rgba(74,40,16,.22); display: grid; gap: 8px; }
.kereso-mezo { display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 2px solid var(--morzsa); border-radius: 10px; background: var(--liszt); }
.kereso-mezo svg { width: 22px; height: 22px; color: #8a6a4e; flex: none; }
.kereso-mezo:focus-within { border-color: var(--gomb); box-shadow: 0 0 0 2px rgba(138,69,19,.25); }
.kereso-mezo input { flex: 1; border: 0; background: transparent; font: 700 21px var(--szoveg); padding: 12px 0; min-height: 52px; outline: none; max-width: none; }
.kereso-lista { list-style: none; margin: 0; padding: 0; max-height: min(52vh, 420px); overflow-y: auto; overscroll-behavior: contain; }
.kereso-lista li { padding: 12px 14px; border-radius: 9px; font-size: 21px; font-weight: 700; cursor: pointer; }
.kereso-lista li:nth-child(even) { background: #efedea; }
.kereso-lista li.aktiv { background: var(--morzsa); }
.kereso-lista li[aria-selected="true"] { color: var(--gomb); }
.kereso-lista li[aria-selected="true"]::after { content: '  ✓'; }
.kereso-lista li.jeles { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.kereso-jel { margin-left: auto; padding: 3px 12px; border-radius: 999px; background: var(--gomb); color: #fff; font-size: 16px; font-weight: 700; white-space: nowrap; }
.kereso-lista li.nincs { color: #8a6a4e; font-weight: 400; cursor: default; background: none; }

/* 4.5 Gombok */
.gomb { display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border-radius: 12px; font-weight: 700; }
.gomb.elso { background: var(--gomb); color: #fff; border: 2px solid var(--gomb); font-size: 21px; padding: 14px 16px; min-height: 66px; }
.gomb.elso:hover { background: var(--gomb-hover); border-color: var(--gomb-hover); }
.gomb.elso svg { width: 30px; height: 30px; flex: none; }
.gomb.masod { background: #fff; color: var(--kakao); border: 2px solid var(--morzsa); padding: 10px 18px; min-height: 52px; }
.gomb.masod:hover { border-color: var(--gomb); }
.gomb.veszely { background: #fff; color: var(--hiba); border: 2px solid #e2b4b4; padding: 10px 18px; min-height: 52px; }
.gomb.veszely:hover { border-color: var(--hiba); }
.gomb.link { background: none; border: 0; color: #9a7a5e; text-decoration: underline; font-size: 15px; padding: 4px; min-height: 44px; font-weight: 400; }
.gomb[disabled] { opacity: .55; cursor: wait; }
.gombpar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
.gombpar .gomb { min-width: 150px; min-height: 56px; font-size: 20px; }
.gombpar .gomb.elso { min-height: 66px; }
.gomb.kicsi { min-height: 46px; padding: 8px 14px; font-size: 17px; }

/* Szerkesztői belépés gomb (4.5) – az oldal alján, jobbra */
.lablec { display: flex; justify-content: flex-end; margin-top: 40px; }
.belepes-gomb { display: inline-flex; align-items: center; gap: 12px; background: #fff; color: var(--kakao); border: 2px solid var(--morzsa);
  border-radius: 14px; min-height: 58px; padding: 8px 18px 8px 10px; cursor: pointer; text-align: left; }
.belepes-gomb:hover { border-color: var(--gomb); }
.belepes-gomb .kor { width: 40px; height: 40px; border-radius: 50%; background: var(--barna); color: #fff; display: grid; place-items: center; flex: none; }
.belepes-gomb .kor svg { width: 22px; height: 22px; }
.belepes-gomb b { display: block; font-size: 18px; }
.belepes-gomb small { display: block; font-size: 14px; color: #8a6a4e; }
.profil .gombok { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; }
input[type=password] { max-width: none; }

/* 4.6 Kártyák */
.iroda { background: #fff; border: 2px solid var(--morzsa); border-radius: 14px; padding: 22px; display: grid; gap: 18px; }
.iroda h2 { margin: 0; font-size: 24px; color: var(--barna); }
.ures-allapot { padding: 28px; border: 2px dashed var(--morzsa); border-radius: 12px; font-size: 20px; color: #8a6a4e; text-align: center; }

/* 4.13 Üzenetek */
.uzenet-ok { color: var(--ok); font-weight: 700; margin: 0; }
.uzenet-hiba { color: var(--hiba); font-weight: 700; margin: 0; }
.uzenet-hiba ul, .figyelmeztetes ul { margin: 6px 0 0; padding-left: 22px; }
.figyelmeztetes { background: var(--liszt); border: 2px solid var(--morzsa); border-radius: 10px; padding: 12px 14px; margin: 0; }

/* Jelvények (státusz) – a meglévő tokenekből */
.pirula { display: inline-block; border-radius: 999px; padding: 2px 12px; font: 700 15px var(--szoveg); white-space: nowrap; border: 1px solid transparent; }
.st-Rögzítve { background: var(--liszt); border-color: var(--morzsa); color: var(--gomb); }
.st-Folyamatban { background: var(--morzsa); color: var(--kakao); }
.st-Elkészült { background: var(--ok); color: #fff; }
.st-Átadva { background: #fff; border-color: var(--morzsa); color: #8a6a4e; }
.st-Elutasítva { background: var(--hiba); color: #fff; }
.pirula.inaktiv { background: #fff; border-color: #e2b4b4; color: var(--hiba); }

/* Csíkozott lista */
.lista { display: grid; border: 2px solid var(--morzsa); border-radius: 14px; overflow: hidden; background: #fff; }
.sor { padding: 16px 18px; display: grid; gap: 8px; border-bottom: 1px solid var(--morzsa); }
.sor:last-child { border-bottom: 0; }
.sor:nth-child(even) { background: #efedea; }
.sor-fej { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sor-fej .nev { font-size: 21px; font-weight: 700; }
.sor-fej .jobbra { margin-left: auto; color: #8a6a4e; font-size: 15px; }
.adatok { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 16px; color: #8a6a4e; }
.adatok b { color: var(--kakao); }
.sor-muvelet { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sor-muvelet select { max-width: 240px; }
.kapcsolo { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: 16px; }
.kapcsolo input { width: 22px; height: 22px; accent-color: var(--gomb); }
.cimkek { display: flex; flex-wrap: wrap; gap: 6px; }
.cimke { background: var(--liszt); border: 1px solid var(--morzsa); border-radius: 999px; padding: 2px 10px; font-size: 15px; }
.cimke.terulet { color: var(--gomb); font-weight: 700; }

.szurok { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.szurok > * { max-width: none; }
.talalat { color: #8a6a4e; font-size: 15px; margin: 0 0 8px; }

/* Jelölőnégyzet-lista (felhasználó-szerkesztő) */
.jelolok { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); border: 2px solid var(--morzsa); border-radius: 10px; overflow: hidden; }
.jelolo { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; cursor: pointer; font-size: 18px; background: #fff; }
.jelolo:nth-child(even) { background: #efedea; }
.jelolo.be { background: var(--morzsa); font-weight: 700; }
.jelolo input { width: 22px; height: 22px; accent-color: var(--gomb); flex: none; }
.csoport-fej { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; font-weight: 700; }

/* 4.11 Szerkeszthető táblázat */
.attabla-hely { overflow: auto; max-height: 70vh; border: 1px solid var(--morzsa); border-radius: 10px; background: #fff; }
.attabla { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; }
.attabla th { position: sticky; top: 0; z-index: 1; background: var(--liszt); font-size: 12px; text-transform: uppercase;
  letter-spacing: .04em; color: #8a6a4e; text-align: center; vertical-align: middle; padding: 8px 6px; }
.attabla th, .attabla td { border-right: 1px solid var(--morzsa); border-bottom: 1px solid var(--morzsa); }
.attabla tr > :last-child { border-right: 0; }
.attabla tbody tr:nth-child(even) td { background: #efedea; }
.attabla td { padding: 4px; vertical-align: middle; text-align: center; }
.attabla input, .attabla select { min-height: 40px; padding: 6px 8px; font-size: 15px; border-radius: 8px; width: 100%; max-width: none; }
.attabla td:first-child { min-width: 220px; }
.attabla td:nth-child(2) { min-width: 200px; }
.attabla .vezeto { font-size: 14px; color: #8a6a4e; text-align: left; padding: 4px 8px; min-width: 140px; }
.attabla .gomb { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.nincs-mentve { color: var(--hiba); font-weight: 700; font-size: 15px; }
.terulet-fej { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.terulet-fej input[type=text] { flex: 1 1 240px; font-weight: 700; font-size: 20px; }
.uj-sor { display: flex; flex-wrap: wrap; gap: 10px; }
.uj-sor input { flex: 1 1 240px; }

/* 4.7 / 4.8 Betöltő (barna keret, százalék) */
.betolto { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; padding: 16px;
  background: rgba(251,246,236,.78); backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: opacity .18s, visibility .18s; }
.betolto.lathato { opacity: 1; visibility: visible; }
.betolto-kartya { width: min(360px, 100%); display: grid; justify-items: center; gap: 14px; text-align: center; background: #fff;
  border: 4px solid var(--barna); border-radius: 16px; padding: 22px 30px 24px; box-shadow: 0 18px 50px rgba(74,40,16,.22); }
.betolto-kartya .logo { width: 110px; height: 54px; object-fit: contain; mix-blend-mode: multiply; }
.betolto-gyuru { position: relative; width: 108px; height: 108px; }
.betolto-gyuru svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.betolto-gyuru circle { fill: none; stroke-width: 8; }
.betolto-gyuru .sav { stroke: #E3D9CB; }
.betolto-gyuru .telt { stroke: var(--barna); stroke-linecap: round; }
.betolto-szazalek { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 800 22px/1 var(--cim); color: var(--barna); font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.betolto-szazalek small { font-size: 13px; font-weight: 700; margin-left: 1px; }
.betolto-csik { width: 100%; height: 10px; background: #E3D9CB; border-radius: 6px; overflow: hidden; position: relative; }
.betolto-csik i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--barna); border-radius: 6px; }
.betolto-szoveg { margin: 0; font-size: 20px; font-weight: 700; }
@media print { .betolto { display: none !important; } }

/* 4.16 „Megszűnt link” / indító kártya */
.rendszer-kartya { width: min(380px, 100%); margin: 8vh auto 0; display: grid; justify-items: center; gap: 12px; text-align: center;
  background: #fff; border: 4px solid var(--barna); border-radius: 16px; padding: 24px 26px; box-shadow: 0 18px 50px rgba(74,40,16,.22); }
.rendszer-kartya img { width: 150px; height: auto; mix-blend-mode: multiply; }
.rendszer-kartya h2 { margin: 0; font: 800 20px/1.25 var(--cim); color: var(--barna); }
.rendszer-kartya p { margin: 0; }

/* Ablakok: kérdező (16px), rendszerablak barna kerettel (4.7), megerősítő (4.9) */
.ablak-hatter { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(74,40,16,.35); overflow-y: auto; }
.ablak { width: min(760px, 100%); display: grid; gap: 16px; background: #fff; border: 2px solid var(--morzsa); border-radius: 16px;
  padding: 22px 24px; box-shadow: 0 18px 50px rgba(74,40,16,.25); margin: auto; }
.ablak.rendszer { border: 4px solid var(--barna); width: min(560px, 100%); }
.ablak h2 { margin: 0; font-size: 24px; color: var(--barna); }
.ablak .racs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ablak .racs > * { display: grid; gap: 8px; align-content: start; }
.ablak .mezocim { font-size: 18px; font-weight: 900; }
.atkerdes-kartya { width: min(460px, 100%); display: grid; gap: 14px; background: #fff; border: 2px solid var(--morzsa);
  border-top: 6px solid #d9467e; border-radius: 16px; padding: 22px 24px; box-shadow: 0 18px 50px rgba(74,40,16,.25); }
.atkerdes-kartya h3 { margin: 0; font-size: 22px; }
.atkerdes-kartya .megj { color: #8a6a4e; font-size: 16px; margin: 0; }
.atkerdes-gombok { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
.atkerdes-gombok button { min-height: 52px; min-width: 130px; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; }
.atkerdes-gombok .megse { background: #fff; color: var(--kakao); border: 2px solid var(--morzsa); }
.atkerdes-gombok .torles { background: #d9467e; border: 2px solid #d9467e; color: #fff; }
.atkerdes-gombok .torles:hover { background: #b9346a; border-color: #b9346a; }

/* Rövid visszajelzés (a 4.13 üzenetszíneivel) */
.jelzes { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 950; max-width: calc(100% - 32px);
  background: #fff; border: 2px solid var(--morzsa); border-radius: 12px; padding: 12px 18px; font-weight: 700;
  box-shadow: 0 14px 40px rgba(74,40,16,.22); color: var(--ok); }
.jelzes.hiba { color: var(--hiba); border-color: #e2b4b4; }

@media (max-width: 680px) {
  .szurok, .ablak .racs { grid-template-columns: 1fr; }
  .profil { flex-wrap: wrap; }
  .sor-fej .jobbra { margin-left: 0; width: 100%; }
  select.fo { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
